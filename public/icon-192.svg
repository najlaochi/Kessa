<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6f42c1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0a2e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="192" height="192" fill="url(#grad)" rx="20"/>
  
  <!-- Stars -->
  <circle cx="30" cy="30" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="160" cy="40" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="170" cy="150" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="20" cy="160" r="2" fill="#fff" opacity="0.8"/>
  
  <!-- Main icon - Book with sparkles -->
  <rect x="56" y="60" width="80" height="60" fill="#fff" rx="4" opacity="0.9"/>
  <rect x="60" y="64" width="72" height="52" fill="#e8dcf8" rx="2"/>
  <line x1="96" y1="64" x2="96" y2="116" stroke="#6f42c1" stroke-width="2"/>
  
  <!-- Sparkles -->
  <text x="50" y="50" font-size="20" fill="#ffd700">✨</text>
  <text x="130" y="55" font-size="16" fill="#ffd700">✨</text>
  
  <!-- Text -->
  <text x="96" y="145" font-family="Arial, sans-serif" font-size="24" fill="#fff" text-anchor="middle" font-weight="bold">حكايات</text>
  <text x="96" y="170" font-family="Arial, sans-serif" font-size="18" fill="#fff" text-anchor="middle">ماما</text>
</svg>
