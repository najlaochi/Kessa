<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6f42c1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0a2e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#grad512)" rx="80"/>
  
  <!-- Stars -->
  <circle cx="80" cy="80" r="6" fill="#fff" opacity="0.8"/>
  <circle cx="430" cy="100" r="6" fill="#fff" opacity="0.8"/>
  <circle cx="450" cy="400" r="6" fill="#fff" opacity="0.8"/>
  <circle cx="60" cy="420" r="6" fill="#fff" opacity="0.8"/>
  <circle cx="400" cy="80" r="4" fill="#fff" opacity="0.6"/>
  <circle cx="120" cy="450" r="4" fill="#fff" opacity="0.6"/>
  
  <!-- Main icon - Book with sparkles -->
  <rect x="156" y="160" width="200" height="160" fill="#fff" rx="10" opacity="0.9"/>
  <rect x="166" y="170" width="180" height="140" fill="#e8dcf8" rx="6"/>
  <line x1="256" y1="170" x2="256" y2="310" stroke="#6f42c1" stroke-width="6"/>
  
  <!-- Sparkles -->
  <text x="120" y="130" font-size="50" fill="#ffd700">✨</text>
  <text x="350" y="140" font-size="40" fill="#ffd700">✨</text>
  <text x="410" y="250" font-size="35" fill="#ffd700">✨</text>
  
  <!-- Text -->
  <text x="256" y="380" font-family="Arial, sans-serif" font-size="64" fill="#fff" text-anchor="middle" font-weight="bold">حكايات</text>
  <text x="256" y="450" font-family="Arial, sans-serif" font-size="48" fill="#fff" text-anchor="middle">ماما</text>
</svg>
